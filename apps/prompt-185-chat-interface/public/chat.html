<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prompt 185 · Agent chat</title><link rel="stylesheet" href="chat.css"><body><main><a href="/">Experiment and source</a><h1>Agent chat</h1><p>Local mode records a real SDK transcript with no inference. Live mode spends model credits. To try approval, ask the agent to write note.txt in its current workspace.</p><label>Mode <select id="mode"><option value="local">Local transcript</option><option value="live">Live model</option></select></label><form id="chat"><label for="prompt">Message</label><textarea id="prompt" maxlength="2000" required>Explain one permission safeguard.</textarea><button id="send">Send</button><button type="button" id="cancel">Cancel active run</button></form><dialog id="approval"><h2>Tool approval</h2><pre id="request"></pre><button id="allow">Allow write</button><button id="deny">Deny</button></dialog><h2>Status</h2><p id="status" role="status">Ready</p><h2>Responses and activity</h2><pre id="events" aria-live="polite"></pre><h2>Session history</h2><pre id="history"></pre></main><script src="chat.js"></script></body></html>
